:root{--bg:#0f1214;--card:#181c20;--card2:#1f242a;--line:#2a3036;--gold:#e8c37e;--text:#d9d3c4;--muted:#8b8778;--ok:#8fc98a;--cook:#e3b04b;--bad:#d9706a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2420 0,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:17px/1.55 'Fraunces',Georgia,'Times New Roman',serif}
h1,h2,h3{color:var(--gold);font-weight:700;margin:0;line-height:1.2}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
header h1{font-size:30px}
header small{display:block;color:var(--muted);font-size:14px;font-weight:400}
button,select,input,textarea{font:inherit;color:var(--text)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--gold)}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1507;border-color:var(--gold);font-weight:600}
.btn.danger{color:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .img{aspect-ratio:4/3;background:#23282e center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.card .body{padding:12px 14px 14px}
.card h3{font-size:19px;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:13px;color:var(--muted)}
.st{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border-radius:6px;padding:2px 8px;border:1px solid}
.st.edible{color:var(--ok);border-color:#3b5d3a;background:#1a2a1a}
.st.cook{color:var(--cook);border-color:#6a5420;background:#2a2412}
.st.toxic{color:var(--bad);border-color:#6b2d2a;background:#2c1514}
.st.unknown{color:var(--muted);border-color:var(--line)}
.sub{color:var(--muted);font-style:italic}
.hero{width:100%;max-height:380px;object-fit:cover;border-radius:14px;margin-bottom:16px;background:#23282e}
.fields{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:14px 0 6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fields div:nth-child(odd){color:var(--muted)}
.fields div:nth-child(even){color:var(--gold)}
h2{font-size:23px;margin:22px 0 8px}
ul.ch{padding-left:22px;margin:0}
ul.ch li::marker{color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.warn{margin-top:26px;font-size:14px;color:var(--muted);border-left:3px solid var(--bad);padding:4px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
label{display:block;color:var(--gold);font-size:14px;margin:14px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.thumbs b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:6px;padding:0 6px;cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;z-index:9}
.lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:8;cursor:zoom-out}
.lb img{max-width:94%;max-height:94%;border-radius:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}.fields{grid-template-columns:105px 1fr}header h1{font-size:25px}}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:3vh 16px 40px;background:linear-gradient(rgba(15,18,20,.05),rgba(15,18,20,.45)),var(--lbg) center/cover no-repeat #0f1214}
.lhead{width:min(380px,74vw);margin-bottom:8px;background:radial-gradient(closest-side,rgba(246,241,226,.9),rgba(246,241,226,.55) 60%,rgba(246,241,226,0))}
.llogo{display:block;width:100%;height:auto;filter:drop-shadow(0 0 10px rgba(246,241,226,.85))}
.lcard{width:100%;max-width:380px;background:rgba(15,18,20,.86);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:22px}
.lcard h2{margin:0 0 12px;font-size:24px}.lcard input{margin-bottom:10px}.lcard .btn{width:100%;margin-top:4px}
.lcard input[type=checkbox],.chk input{width:auto;margin:0 8px 0 0}.chk{display:flex;align-items:center;color:var(--text);margin:2px 0 8px;font-size:15px}
.lnk{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:14px;color:var(--gold)}.lnk span{cursor:pointer}
#lerr{color:var(--bad);font-size:14px;margin-top:10px;min-height:1px}.disc{font-size:12.5px;color:var(--muted);margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>

<script>
const FAMILIES=['Lamiaceae','Asteraceae','Rosaceae','Apiaceae','Fabaceae'];
const SECTIONS={berries:{label:'Berries, Fruits, Nuts',colors:['Yellow, Orange, Red','Blue, Black']},
wild:{label:'Wild Plants',colors:['White','Yellow','Pink, Red','Violet, Blue','Green, Brown, Algae']}};
const STATUS={edible:'Edible',cook:'Cook first',toxic:'Toxic',unknown:'Unverified'};
const KEY='herbarium-plants-v1';
let plants=[],db=null,view='list',cur=null,draft=null,F={q:'',section:'',color:'',family:'',status:'',src:''},confirmDel=false,ready=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=s=>esc(s).replace(/\n/g,'<br>');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ---------- storage & auth ---------- */
const firebaseConfig={apiKey:"AIzaSyAE5Hp4P8CcWJRZGWd8TCFfXAR2EjQvYkg",authDomain:"herbarium-4fdd5.firebaseapp.com",projectId:"herbarium-4fdd5",storageBucket:"herbarium-4fdd5.firebasestorage.app",messagingSenderId:"332516594131",appId:"1:332516594131:web:7b3f7b0d222539f37f5f26"};
const ADMIN_UID="fEcU74WU50cLn2U543duhNBhJLq1";
let fb=null,user=null,isAdmin=false,authReady=false,regMode=false,lib=[],mine=[],unsubs=[];
function merge(){plants=[...lib.map(p=>({...p,_src:'lib'})),...mine.map(p=>({...p,_src:'mine'}))];ready=true;if(view!=='edit'&&view!=='import')render()}
const pathFor=d=>d==='lib'?'library':`users/${user.uid}/plants`;
const withTimeout=p=>Promise.race([p,new Promise(r=>setTimeout(r,4000))]);
async function savePlant(p){
  const {id,_src,_dest,...data}=p;
  if(JSON.stringify(data).length>240000)throw new Error('Too many/large images for one plant. Remove a picture.');
  await withTimeout(fb.setDoc(fb.doc(fb.db,pathFor(_dest||_src||'mine'),id),data));
}
async function removePlant(id){
  const p=plants.find(x=>x.id===id);
  await withTimeout(fb.deleteDoc(fb.doc(fb.db,pathFor(p&&p._src),id)));
}
function setErr(m){$('#lerr').textContent=m||''}
function authMsg(e){const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'Email or password is incorrect.';
  if(c==='auth/email-already-in-use')return 'An account with this email already exists. Try logging in.';
  if(c==='auth/weak-password')return 'Please choose a password with at least 6 characters.';
  if(c==='auth/invalid-email')return 'That email address does not look right.';
  if(c==='auth/too-many-requests')return 'Too many attempts. Please wait a bit and try again.';
  if(c==='auth/network-request-failed')return 'No connection. Please check your internet.';
  return 'Something went wrong. Please try again.'}
function setMode(){const L=regMode;$('#ltitle').textContent=L?'Create account':'Log in';$('#lgo').textContent=L?'Create account':'Log in';
  $('#lmode').textContent=L?'Already have an account? Log in':'New here? Create an account';$('#pw').autocomplete=L?'new-password':'current-password';setErr('')}
async function doAuth(){
  if(!fb){setErr('This copy is not connected to Firebase yet.');return}
  const em=$('#em').value.trim(),pw=$('#pw').value;
  if(!em||!pw){setErr('Please enter your email and password.');return}
  setErr('');
  try{await fb.setPersistence(fb.auth,$('#rem').checked?fb.browserLocalPersistence:fb.browserSessionPersistence);
    regMode?await fb.createUserWithEmailAndPassword(fb.auth,em,pw):await fb.signInWithEmailAndPassword(fb.auth,em,pw)}
  catch(e){setErr(authMsg(e))}
}
async function doReset(){
  const em=$('#em').value.trim();if(!fb||!em){setErr('Enter your email above first, then tap “Forgot password?”.');return}
  try{await fb.sendPasswordResetEmail(fb.auth,em);setErr('If that account exists, a reset email is on its way.')}catch(e){setErr(authMsg(e))}
}
async function init(){
  try{
    if(firebaseConfig.apiKey.startsWith('PASTE'))throw new Error('config');
    const V='https://www.gstatic.com/firebasejs/10.14.1/';
    const [A,Au,Fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=A.initializeApp(firebaseConfig);let db;
    try{db=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({tabManager:Fs.persistentMultipleTabManager()})})}catch(e){db=Fs.getFirestore(app)}
    fb={...Au,...Fs,auth:Au.getAuth(app),db};
    fb.onAuthStateChanged(fb.auth,u=>{
      unsubs.forEach(f=>f());unsubs=[];user=u;isAdmin=!!u&&u.uid===ADMIN_UID;authReady=true;lib=[];mine=[];plants=[];ready=false;view='list';
      if(u){const bad=()=>toast('Could not load your plants');
        unsubs=[fb.onSnapshot(fb.collection(fb.db,'library'),s=>{lib=s.docs.map(d=>({id:d.id,...d.data()}));merge()},bad),
          fb.onSnapshot(fb.collection(fb.db,'users/'+u.uid+'/plants'),s=>{mine=s.docs.map(d=>({id:d.id,...d.data()}));merge()},bad)]}
      render()});
  }catch(e){authReady=true;render();if(!fb)setErr('This copy is not connected to Firebase yet.')}
}

/* ---------- helpers ---------- */
function resize(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function filtered(){
  const q=F.q.trim().toLowerCase();
  return plants.filter(p=>(!F.section||p.section===F.section)&&(!F.color||p.color===F.color)&&(!F.family||p.family===F.family)&&(!F.status||p.status===F.status)&&(!F.src||p._src===F.src)&&
    (!q||[p.name,p.latin,p.german].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
function opts(list,sel,blank){return (blank!=null?`<option value="">${blank}</option>`:'')+list.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`}).join('')}
const familyList=()=>[...new Set([...FAMILIES,...plants.map(p=>(p.family||'').trim()).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
const colorList=sec=>sec?SECTIONS[sec].colors:[...SECTIONS.berries.colors.map(c=>c),...SECTIONS.wild.colors];

/* ---------- views ---------- */
function render(){
  const a=$('#app');
  $('#login').style.display=authReady&&!user?'flex':'none';a.style.display=user?'block':'none';
  if(!user)return;
  if(view==='list')a.innerHTML=listView();
  else if(view==='detail')a.innerHTML=detailView();
  else if(view==='edit')a.innerHTML=editView();
  else if(view==='import')a.innerHTML=importView();
  window.scrollTo(0,0);
  if(view==='list'){const q=$('#q');if(q&&F.q){q.focus();q.setSelectionRange(F.q.length,F.q.length)}}
}
function listView(){
  const list=filtered();
  const secOpts=Object.entries(SECTIONS).map(([k,v])=>[k,v.label]);
  const cards=list.map(p=>`<div class="card" data-act="open" data-id="${esc(p.id)}">
    <div class="img" style="${p.cover?`background-image:url('${p.cover}')`:''}">${p.cover?'':'No picture yet'}</div>
    <div class="body"><h3>${esc(p.name||'Untitled')}</h3><div class="sub" style="margin-bottom:8px">${esc(p.latin)}</div>
    <div class="tags"><span class="tag">${p._src==='lib'?'Library':'Mine'}</span><span class="st ${p.status||'unknown'}">${STATUS[p.status||'unknown']}</span>${p.family?`<span class="tag">${esc(p.family)}</span>`:''}${p.harvest?`<span class="tag">Harvest ${esc(p.harvest)}</span>`:''}</div></div></div>`).join('');
  return `<header><h1>Herbarium<small>Edible &amp; Toxic Plants · field guide</small></h1>
    <div style="display:flex;gap:8px"><button class="btn" data-act="import">Import list</button><button class="btn primary" data-act="new">+ Add plant</button><button class="btn" data-act="logout">Log out</button></div></header>
  <div class="filters">
    <input id="q" placeholder="Search name, Latin, German…" value="${esc(F.q)}">
    <select data-f="section">${opts(secOpts,F.section,'All sections')}</select>
    <select data-f="color">${opts(colorList(F.section),F.color,'All colours')}</select>
    <select data-f="family">${opts(familyList(),F.family,'All families')}</select>
    <select data-f="status">${opts(Object.entries(STATUS),F.status,'Any status')}</select>
    <select data-f="src">${opts([['lib','Library'],['mine','My plants']],F.src,'Library + mine')}</select></div>
  <div class="sub" style="margin-bottom:10px">${ready?`${list.length} of ${plants.length} plants`:'Loading…'}</div>
  ${list.length?`<div class="grid">${cards}</div>`:`<div class="panel empty">${plants.length?'No plants match these filters.':'Your herbarium is empty. Add your first plant, or import your Google Sheets list (Import list).'}</div>`}
  <div class="row" style="margin-top:26px;justify-content:center"><button class="btn" data-act="backup">Export backup</button><button class="btn" data-act="restore">Restore from backup</button><input type="file" id="rf" accept=".json,application/json" hidden></div>`;
}
function detailView(){
  const p=plants.find(x=>x.id===cur);if(!p){view='list';return listView()}
  const sec=SECTIONS[p.section];
  const rows=[['Latin',p.latin],['German',p.german],['Family',p.family],['Edible',p.edibleAs],['Harvest',p.harvest],['Bloom',p.bloom],['Category',sec?`${sec.label} · ${p.color||''}`:'']].filter(r=>r[1]).map(r=>`<div>${r[0]}</div><div>${esc(r[1])}</div>`).join('');
  const blk=(t,v)=>v?`<h2>${t}</h2><div>${para(v)}</div>`:'';
  const ch=(p.characteristics||'').split('\n').map(s=>s.trim()).filter(Boolean);
  return `<div class="row"><button class="btn" data-act="back">← Back</button><div style="display:flex;gap:8px">${p._src==='lib'?'<button class="btn" data-act="copy">Copy to my plants</button>':''}${(p._src==='mine'||isAdmin)?`<button class="btn" data-act="edit">Edit</button><button class="btn danger" data-act="del">${confirmDel?'Tap again to delete':'Delete'}</button>`:''}</div></div>
  <div class="panel">${p.cover?`<img class="hero" src="${p.cover}" alt="">`:''}
  <div class="tags" style="margin-bottom:8px"><span class="st ${p.status||'unknown'}">${STATUS[p.status||'unknown']}</span></div>
  <h1>${esc(p.name)}</h1><div class="fields">${rows}</div>
  ${ch.length?`<h2>Characteristics</h2><ul class="ch">${ch.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
  ${(p.images||[]).length?`<h2>Identification images</h2><div class="gal">${p.images.map(s=>`<img src="${s}" data-act="zoom" alt="">`).join('')}</div>`:''}
  ${blk('Where to find',p.where)}${blk('How to eat',p.howToEat)}${blk('Medicinal uses',p.medicinal)}${blk('Preparation &amp; use',p.preparation)}
  <div class="warn">This is a personal learning guide, not expert identification. Never eat a wild plant unless you are 100% certain of its identity: many edible plants have toxic look-alikes. Use at your own risk.</div></div>`;
}
function editView(){
  const d=draft,secOpts=Object.entries(SECTIONS).map(([k,v])=>[k,v.label]);
  const f=(k,l,ph)=>`<label>${l}</label><input data-d="${k}" value="${esc(d[k])}" placeholder="${ph||''}">`;
  const t=(k,l,ph)=>`<label>${l}</label><textarea data-d="${k}" placeholder="${ph||''}">${esc(d[k])}</textarea>`;
  return `<div class="row"><button class="btn" data-act="cancel">← Cancel</button><button class="btn primary" data-act="save">Save plant</button></div>
  <div class="panel"><h1>${d._new?'New plant':'Edit plant'}</h1>
  ${d._new&&isAdmin?`<label>Save to</label><select data-d="_dest">${opts([['mine','My plants (private)'],['lib','Shared library (visible to everyone)']],d._dest||'mine')}</select>`:''}
  ${f('name','Common name','e.g. Common Barberry')}
  <div class="two"><div>${f('latin','Latin name','Berberis vulgaris L.')}</div><div>${f('german','German name','Gemeine Berberitze')}</div></div>
  <div class="two"><div><label>Plant family</label><input data-d="family" list="fams" value="${esc(d.family)}" placeholder="Type or pick, e.g. Rosaceae"><datalist id="fams">${familyList().map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div>
  <div><label>Status</label><select data-d="status">${opts(Object.entries(STATUS),d.status)}</select></div></div>
  <div class="two"><div><label>Section</label><select data-d="section">${opts(secOpts,d.section,'— choose —')}</select></div>
  <div><label>Colour</label><select data-d="color">${opts(d.section?SECTIONS[d.section].colors:[],d.color,'— choose —')}</select></div></div>
  <div class="two"><div>${f('edibleAs','Edible as','Raw, Cooked')}</div><div>${f('harvest','Harvest','From September')}</div></div>
  ${f('bloom','Bloom','May–June')}
  <label>Cover picture</label><input type="file" accept="image/*" data-up="cover">
  ${d.cover?`<div class="thumbs"><div><img src="${d.cover}"><b data-act="rmcover">×</b></div></div>`:''}
  ${t('characteristics','Characteristics (one per line)','Tree or shrub\nLeaves\nFlowers\nFruit')}
  <label>Identification images</label><input type="file" accept="image/*" multiple data-up="images">
  <div class="thumbs">${(d.images||[]).map((s,i)=>`<div><img src="${s}"><b data-act="rmimg" data-i="${i}">×</b></div>`).join('')}</div>
  ${t('where','Where to find')}${t('howToEat','How to eat')}${t('medicinal','Medicinal uses')}${t('preparation','How to prepare &amp; use')}</div>`;
}
function importView(){
  return `<div class="row"><button class="btn" data-act="cancel">← Cancel</button><button class="btn primary" data-act="doimport">Import</button></div>
  <div class="panel"><h1>Import from Google Sheets</h1>
  <p class="sub">In your sheet, select the table (including the header row), copy it, and paste below. Recognised column headers: Name, Latin, German, Family, Section, Colour, Status, Edible, Harvest, Bloom. Anything missing can be filled in later. Imported plants without a clear status are marked “Unverified”.</p>
  ${isAdmin?`<label>Import into</label><select id="idest"><option value="mine">My plants (private)</option><option value="lib">Shared library</option></select>`:''}
  <textarea id="csv" style="min-height:260px" placeholder="Name&#9;Latin&#9;German&#9;Family&#9;…"></textarea></div>`;
}

/* ---------- import ---------- */
function parseTable(txt){
  const d=txt.includes('\t')?'\t':',',rows=[];let r=[],c='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  r.push(c);rows.push(r);return rows.filter(x=>x.some(v=>v.trim()));
}
function doImport(){
  const rows=parseTable($('#csv').value);if(rows.length<2){toast('Paste a header row plus at least one plant');return}
  const H=rows[0].map(h=>h.toLowerCase()),ix=re=>H.findIndex(h=>re.test(h));
  const m={name:ix(/name|plant|common/),latin:ix(/latin|botan/),german:ix(/german|deutsch/),family:ix(/famil/),section:ix(/section|categ|type/),color:ix(/colou?r/),status:ix(/status|toxic|edible/),harvest:ix(/harvest/),bloom:ix(/bloom|flower/)};
  if(m.name<0)m.name=0;
  const g=(r,k)=>m[k]>=0?(r[m[k]]||'').trim():'';
  const out=rows.slice(1).map((r,n)=>{
    const sec=/wild/i.test(g(r,'section'))?'wild':'berries';
    const cv=g(r,'color').toLowerCase();
    const color=cv?(SECTIONS[sec].colors.find(o=>cv.split(/[ ,\/&-]+/).some(w=>w.length>2&&o.toLowerCase().includes(w.slice(0,4))))||''):'';
    const fr=g(r,'family');const fam=familyList().find(f=>f.toLowerCase()===fr.toLowerCase())||fr;
    const sv=g(r,'status').toLowerCase();
    const status=/toxic|poison|giftig/.test(sv)?'toxic':/cook/.test(sv)&&!/raw/.test(sv)?'cook':/edible|raw|ess/.test(sv)?'edible':'unknown';
    return {id:'p'+Date.now().toString(36)+n,name:g(r,'name'),latin:g(r,'latin'),german:g(r,'german'),family:fam,section:sec,color,status,harvest:g(r,'harvest'),bloom:g(r,'bloom'),edibleAs:'',characteristics:'',where:'',howToEat:'',medicinal:'',preparation:'',cover:'',images:[]};
  }).filter(p=>p.name);
  (async()=>{try{const dest=($('#idest')||{}).value||'mine';for(const p of out)await savePlant({...p,_dest:dest});toast(`Imported ${out.length} plants`);view='list';render()}catch(e){toast('Import failed: '+e.message)}})();
}

async function doBackup(){
  const mineList=plants.filter(p=>p._src==='mine').map(({_src,...r})=>r);if(!mineList.length){toast('Nothing of yours to back up yet');return}
  try{
    const dl=window.claude?await claude.use('downloads'):null;
    const name=`herbarium-backup-${new Date().toISOString().slice(0,10)}.json`;
    const json=JSON.stringify({app:'herbarium',version:1,plants:mineList});
    if(dl){await dl.save({filename:name,data:json})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
    toast('Backup saved')}catch(e){if(!e||e.code!=='declined')toast('Could not save backup')}
}
async function doRestore(file){
  try{const j=JSON.parse(await file.text());const arr=Array.isArray(j)?j:j.plants;
    if(!Array.isArray(arr)||!arr.every(p=>p&&p.id&&typeof p.name==='string'))throw new Error('This does not look like a Herbarium backup');
    let n=0;for(const p of arr){await savePlant(p);n++}
    toast(`Restored ${n} plants`);render()}catch(e){toast('Restore failed: '+(e.message||'error'))}
}
/* ---------- events ---------- */
const blank=()=>({_new:true,id:'p'+Date.now().toString(36),name:'',latin:'',german:'',family:'',section:'berries',color:'',status:'unknown',edibleAs:'',harvest:'',bloom:'',characteristics:'',where:'',howToEat:'',medicinal:'',preparation:'',cover:'',images:[]});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  if(act==='open'){cur=el.dataset.id;view='detail';confirmDel=false;render()}
  else if(act==='back'||act==='cancel'){view=act==='cancel'&&draft&&!draft._new?'detail':'list';draft=null;render()}
  else if(act==='new'){draft=blank();view='edit';render()}
  else if(act==='edit'){draft=JSON.parse(JSON.stringify(plants.find(p=>p.id===cur)));view='edit';render()}
  else if(act==='import'){view='import';render()}
  else if(act==='doimport')doImport();
  else if(act==='backup')doBackup();
  else if(act==='restore')$('#rf').click();
  else if(act==='logout'){fb.signOut(fb.auth)}
  else if(act==='auth')doAuth();
  else if(act==='reset')doReset();
  else if(act==='mode'){regMode=!regMode;setMode()}
  else if(act==='copy'){const o=plants.find(p=>p.id===cur);draft={...JSON.parse(JSON.stringify(o)),_new:true,_src:'mine',_dest:'mine',id:'p'+Date.now().toString(36)};view='edit';render()}
  else if(act==='zoom'){const l=document.createElement('div');l.className='lb';l.innerHTML=`<img src="${el.src}">`;l.onclick=()=>l.remove();document.body.appendChild(l)}
  else if(act==='rmcover'){draft.cover='';render()}
  else if(act==='rmimg'){draft.images.splice(+el.dataset.i,1);render()}
  else if(act==='del'){if(!confirmDel){confirmDel=true;render();return}
    try{await removePlant(cur);toast('Deleted');view='list';render()}catch(er){toast('Could not delete: '+er.message)}}
  else if(act==='save'){
    if(!draft.name.trim()){toast('Please enter a name');return}
    const {_new,...p}=draft;
    p.family=(p.family||'').trim();const known=familyList().find(f=>f.toLowerCase()===p.family.toLowerCase());if(known)p.family=known;
    try{await savePlant(p);cur=p.id;view='detail';draft=null;confirmDel=false;render();toast('Saved')}
    catch(er){toast('Could not save: '+(er.message||er.code||'error'))}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){F.q=e.target.value;render()}
  else if(e.target.dataset.d)draft[e.target.dataset.d]=e.target.value;
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='rf'){if(t.files[0])doRestore(t.files[0]);t.value=''}
  else if(t.dataset.f){F[t.dataset.f]=t.value;if(t.dataset.f==='section')F.color='';render()}
  else if(t.dataset.d){draft[t.dataset.d]=t.value;if(t.dataset.d==='section'){draft.color='';render()}}
  else if(t.dataset.up){
    try{
      if(t.dataset.up==='cover'&&t.files[0])draft.cover=await resize(t.files[0],640,.68);
      else for(const f of t.files)draft.images.push(await resize(f,520,.62));
      render();
    }catch(er){toast('Could not read that image')}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))doAuth()});
init();
</script>
</body>
</html>
